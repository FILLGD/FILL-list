
name: Build FILL List

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "4.6.0"
          bindings: "vwtfafa/bindings"
          bindings-ref: "fix/2.2081-depends"        