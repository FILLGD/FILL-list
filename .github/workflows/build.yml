name: Build FILL List

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "given"
          target: "Android64"

      - name: Upload Android mod
        uses: actions/upload-artifact@v4
        with:
          name: FILL-List-Android
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error